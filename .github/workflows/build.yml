name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src\ClaudeForVS -c Release --no-incremental -warnaserror

      - name: Test
        run: dotnet test tests\ClaudeForVS.Tests -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeForVS.vsix
          path: src/ClaudeForVS/bin/Release/net48/ClaudeForVS.vsix
