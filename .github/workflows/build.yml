name: Build

# Every push and pull request builds and tests the extension and keeps the .vsix as an artifact of the run.
# Pushing a tag named after the version (e.g. v0.17.0) also publishes a GitHub release with the .vsix attached.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless; tags and releases always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/ClaudeForVS/source.extension.vsixmanifest
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'v${{ steps.version.outputs.version }}') {
            Write-Error "The tag ${{ github.ref_name }} doesn't match the version in source.extension.vsixmanifest (${{ steps.version.outputs.version }})."
            exit 1
          }

      - name: Build
        run: dotnet build src\ClaudeForVS -c Release --no-incremental -warnaserror

      - name: Test
        run: dotnet test tests\ClaudeForVS.Tests -c Release --logger trx --results-directory TestResults

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeForVS-${{ steps.version.outputs.version }}
          path: src/ClaudeForVS/bin/Release/net48/ClaudeForVS.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeForVS-${{ needs.build.outputs.version }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv ClaudeForVS.vsix "ClaudeForVS-${{ needs.build.outputs.version }}.vsix"
          gh release create "${{ github.ref_name }}" "ClaudeForVS-${{ needs.build.outputs.version }}.vsix" \
            --repo "${{ github.repository }}" --title "Claude for VS ${{ needs.build.outputs.version }}" --generate-notes
